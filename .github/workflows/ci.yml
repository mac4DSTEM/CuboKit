# CuboKit CI: a script check and the test run (tools/test.sh = `swift test -c release`).
#
# Actions must be enabled on the repository. The package needs macOS 15 or later and a Swift 6.2 or later toolchain
# (Package.swift: `.macOS(.v15)`, tools 6.2); `macos-latest` with its newest Xcode carries both.
# No real data in CI: RealDataTests skip by name when ~/Library/Caches/CuboKit/real-data is absent, so tools/test.sh is
# green without it. No libhdf5 and no References/ (CuboKit has no package dependencies).
# Never `swift build --build-tests -c release` (fails on this toolchain's Swift Build backend); tools/test.sh is the gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          swift --version
      - name: Hook proof (no sleep or poll loops, no kills by name)
        run: tools/hooks/test-no-sleep-poll.sh
      - name: Gate (tools/test.sh, release)
        run: tools/test.sh
