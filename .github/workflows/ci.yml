# CuboKit CI: the hook proof and the gate (tools/test.sh = `swift test -c release`).
#
# Written 2026-10-15; enabling Actions on the repository is the owner's. The package needs macOS 27 and a Swift 6.2
# toolchain (Package.swift: `.macOS("27.0")`, tools 6.2): the runner must provide a toolchain for that SDK. The runner
# image is `macos-latest` with the newest Xcode selected, as FormatoKit and SpectroKit; if the image lags, pin `runs-on`
# to the first image that carries an Xcode with the macOS 27 SDK.
# No real data in CI: RealDataTests skip by name when ~/Library/Caches/CuboKit/real-data is absent, so tools/test.sh is
# green without it and writes no stamp. No libhdf5 and no References/ (CuboKit has no package dependencies).
# Never `swift build --build-tests -c release` (fails on this toolchain's Swift Build backend); tools/test.sh is the gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          swift --version
      - name: Hook proof (no sleep or poll loops, no kills by name)
        run: tools/hooks/test-no-sleep-poll.sh
      - name: Gate (tools/test.sh, release)
        run: tools/test.sh
