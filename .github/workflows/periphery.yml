# Unused-code scan (Periphery). A copy of the suite's template; edit it there.
# Weekly: builds the package and its tests, scans with --retain-public (a kit's public API is used by the apps), and keeps
# one open issue, "Periphery weekly scan", up to date with the findings. Findings are for triage; nothing is deleted here.
# On a pull request that touches Swift: the same scan without the findings .periphery-baseline.json records (triaged and
# kept) and without Codable properties (test fixtures). A finding that is left is new: it is annotated on the PR as a
# warning and the job stays green. Delete the code or, for a false positive, write the baseline again in the same PR:
#   swift build --build-system native --build-tests
#   periphery scan --retain-public --retain-codable-properties --skip-build \
#     --index-store-path .build/debug/index/store --write-baseline .periphery-baseline.json
name: Periphery

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
  pull_request:
    paths: ["**.swift", ".periphery-baseline.json", ".github/workflows/periphery.yml"]

permissions:
  contents: read
  issues: write

jobs:
  scan:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Periphery
        run: brew install periphery && periphery version
      - name: Build with the index store
        run: swift build --build-system native --build-tests
      - name: Scan
        run: |
          periphery scan --retain-public --skip-build --index-store-path .build/debug/index/store \
            --format csv --relative-results > periphery.csv
          echo "count=$(( $(wc -l < periphery.csv) - 1 ))" >> "$GITHUB_ENV"
      - name: Update the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Periphery weekly scan"
          echo "Periphery $(periphery version), commit ${GITHUB_SHA::7}, $(date -u +%Y-%m-%d): **${count} findings** (run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." > body.md
          printf '\n| Kind | Name | Location | Hint |\n|---|---|---|---|\n' >> body.md
          python3 - >> body.md <<'PY'
          import csv
          for r in list(csv.DictReader(open('periphery.csv')))[:100]:
              print(f"| {r['Kind']} | `{r['Name']}` | {r['Location']} | {r['Hints']} |")
          PY
          [ "$count" -le 100 ] || echo "| … | $((count - 100)) more in the run's log | | |" >> body.md
          cat periphery.csv
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$n" ]; then gh issue edit "$n" --body-file body.md; else gh issue create --title "$title" --body-file body.md; fi

  new-findings:
    name: New unused code (warning only)
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install Periphery
        run: brew install periphery && periphery version
      - name: Build with the index store
        run: swift build --build-system native --build-tests
      - name: Scan against the baseline
        run: |
          periphery scan --retain-public --retain-codable-properties --skip-build --index-store-path .build/debug/index/store \
            --baseline .periphery-baseline.json --format github-actions --relative-results | tee periphery.txt
          count=$(grep -c '^::warning' periphery.txt || true)
          echo "Periphery: ${count} new finding(s) against .periphery-baseline.json" >> "$GITHUB_STEP_SUMMARY"
